<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля - Wordloop</title>
    <link rel="stylesheet" href="/assets/css/forgot_password.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<form class="forgot_password_form" method="post" action="/api/v1/auth/forgot-password">

    <h4 class="mb-3">Восстановление пароля</h4>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <div class="mb-3">
        <label for="emailInput" class="form-label">
            Введите ваш email
        </label>
        <p class="form-text mt-0 mb-2">Мы отправим на него ссылку для сброса пароля.</p>
        <input type="email" class="form-control" id="emailInput" name="email"
               placeholder="your.email@example.com" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>

</form>

</body>
</html>
