<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Установка нового пароля - Wordloop</title>
    <link rel="stylesheet" href="/assets/css/reset_password.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<form class="reset_password_form" method="post" action="/api/v1/auth/reset-password"
      onsubmit="return validatePasswords()">
    <h4 class="mb-3">Установите новый пароль</h4>
    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}
    <input type="hidden" name="token" value="{{ token }}">
    <div class="mb-3">
        <label for="password" class="form-label">Новый пароль</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <div class="mb-3">
        <label for="confirm_password" class="form-label">Подтвердите пароль</label>
        <input type="password" class="form-control" id="confirm_password" required>
    </div>
    <div id="password_error" style="color:red; display:none;" class="form-text mb-2">
        Пароли не совпадают.
    </div>
    <button type="submit" class="btn btn-primary w-100">Сохранить новый пароль</button>
</form>

<script>
    function validatePasswords() {
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;
        const errorDiv = document.getElementById('password_error');

        if (password !== confirm_password) {
            errorDiv.style.display = 'block';
            return false;
        }

        errorDiv.style.display = 'none';
        return true;
    }
</script>

</body>
</html>
